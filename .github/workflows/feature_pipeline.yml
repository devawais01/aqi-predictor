name: Feature Pipeline

# Runs hourly. Fetches the last 7 days of observations from Open-Meteo,
# upserts them into raw_observations, then rebuilds the trailing feature
# window and writes it to the feature store.
#
# The 21-day rebuild window is deliberate: aqi_lag_168 and aqi_roll_168 each
# need a full week of history behind them, and the targets need 72 hours
# ahead, so recomputing a single row is not possible.

on:
  schedule:
    - cron: '5 * * * *'      # five past every hour
  workflow_dispatch:          # manual trigger from the Actions tab

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  update-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz

      - name: Run incremental feature pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.features.feature_pipeline --mode incremental

      - name: Report feature store state
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          from src.utils import db_client
          print('raw_observations rows:', db_client.raw_row_count())
          print('latest raw timestamp :', db_client.latest_raw_timestamp())
          "