name: Training Pipeline

# Runs daily at 00:30 UTC (05:30 PKT). Retrains every model on the current
# contents of the feature store, selects the best per horizon by mean
# walk-forward CV R2, and uploads artifacts to the Supabase model registry.
#
# SARIMAX is skipped: its rolling-origin evaluation takes several minutes
# per horizon and it loses at every horizon. It is retained in the codebase
# and reported in the final results as the statistical baseline.

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      skip_lstm:
        description: 'Skip the LSTM (faster run)'
        type: boolean
        default: false

concurrency:
  group: training-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv supabase pytz \
                      scikit-learn xgboost statsmodels joblib tensorflow-cpu

      - name: Train models and update registry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TF_CPP_MIN_LOG_LEVEL: '3'
          TF_ENABLE_ONEDNN_OPTS: '0'
        run: |
          python -m src.models.train_model --skip-sarimax \
            ${{ inputs.skip_lstm && '--skip-lstm' || '' }}

      - name: Compute SHAP explanations
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install shap matplotlib
          python -m src.models.explain --sample 500

      - name: Upload metrics as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-metrics
          path: |
            models/metrics.json
            models/meta_t*.json
            models/shap_summary.json
          retention-days: 14